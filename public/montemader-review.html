<!doctype html>
<!--
  GEMINI REVIEW APPLIED:
  - Preserved the purple, pink, and black visual design, raised M mark, and motion.
  - Kept reduced-motion behavior and added native modal focus handling.
  - The inline CSS/JS is permitted by the current report-only CSP; that does not
    mean the page is compatible with a strict enforcing CSP without a nonce/hash.
  - Authentication must still be enforced by the server, not by this static page.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09070d">
  <meta name="description" content="Montemader sign in">
  <title>Montemader · Sign in</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #09070d;
      --purple: #683386;
      --violet: #9e3ca5;
      --pink: #c74b9e;
      --gold: #e7c177;
      --cream: #fff3d2;
      --text: #f0dff0;
      --muted: #b9abc3;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgb(104 51 134 / 18%), transparent 38%),
        radial-gradient(ellipse at 50% -18%, rgb(199 75 158 / 11%), transparent 48%),
        linear-gradient(180deg, #100b16 0%, var(--night) 68%, #050407 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--cream); outline-offset: 4px; }
    .entry { display: grid; width: min(100%, 420px); min-height: 100dvh; place-items: center; padding: 24px; }
    .mark {
      position: relative;
      isolation: isolate;
      display: grid;
      width: clamp(144px, 42vw, 190px);
      aspect-ratio: 1;
      place-items: center;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: transparent;
      color: var(--purple);
      cursor: pointer;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: clamp(112px, 33vw, 152px);
      font-weight: 400;
      line-height: 1;
      -webkit-text-stroke: 1.5px #f3d59a;
      text-shadow:
        0 1px 0 var(--cream),
        0 2px 0 var(--gold),
        0 4px 0 #e79ac9,
        0 7px 0 var(--pink),
        0 10px 0 var(--violet),
        0 14px 0 #71388f,
        0 18px 0 #43234a,
        0 24px 30px rgb(0 0 0 / 84%),
        0 0 30px rgb(123 63 158 / 40%),
        0 0 34px rgb(229 189 104 / 18%);
      animation: mark-lift 2.8s ease-in-out infinite;
      transition: filter .18s ease, transform .18s ease;
    }

    .mark::before {
      position: absolute;
      z-index: 0;
      inset: 7%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 17% 31%, rgb(229 189 104 / 68%) 0 1px, transparent 2px),
        radial-gradient(circle at 83% 36%, rgb(199 75 158 / 58%) 0 1px, transparent 2px),
        radial-gradient(circle at 27% 78%, rgb(123 63 158 / 78%) 0 1px, transparent 2px),
        radial-gradient(circle at 76% 74%, rgb(229 189 104 / 52%) 0 1px, transparent 2px),
        radial-gradient(ellipse at center, rgb(123 63 158 / 17%), transparent 67%);
      filter: blur(.4px);
      opacity: .56;
      animation: aura 3.8s ease-in-out infinite;
      content: "";
      pointer-events: none;
    }

    .mark span { position: relative; z-index: 1; }
    .mark[hidden] { display: none; }
    .mark:hover { animation-play-state: paused; transform: translateY(-7px) scale(1.04); filter: drop-shadow(0 18px 12px rgb(0 0 0 / 58%)) drop-shadow(0 0 10px rgb(229 189 104 / 20%)); }
    .mark:active { animation-play-state: paused; transform: translateY(2px); }
    .sign-in { position: fixed; inset: 0; width: min(calc(100% - 32px), 340px); max-height: calc(100dvh - 32px); overflow-y: auto; margin: auto; border: 1px solid rgb(123 63 158 / 48%); border-radius: 16px; padding: 22px; background: rgb(20 12 30 / 98%); color: var(--text); box-shadow: 0 12px 46px rgb(0 0 0 / 38%), 0 0 22px rgb(123 63 158 / 12%); }
    .sign-in::backdrop { background: rgb(5 4 7 / 72%); backdrop-filter: blur(4px); }
    .sign-in-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .sign-in h1 { margin: 0; color: var(--text); font: 400 24px/1.2 Georgia, serif; text-align: center; }
    .sign-in .close-dialog { min-height: 36px; border: 1px solid #594365; border-radius: 6px; padding: 6px 10px; background: #140c1e; color: var(--text); cursor: pointer; font-size: 11px; }
    .sign-in form { display: grid; gap: 12px; }
    .sign-in label { display: grid; gap: 5px; color: #c4b3cf; font-size: 11px; }
    .sign-in input { min-height: 40px; border: 1px solid #594365; border-radius: 6px; padding: 9px 10px; background: #08060c; color: var(--text); font-size: 13px; }
    .sign-in button[type="submit"] { min-height: 40px; margin-top: 3px; border: 0; border-radius: 6px; background: linear-gradient(135deg, #71388f, #9e3ca5 60%, #bd5898); color: white; cursor: pointer; font-size: 12px; font-weight: 600; }
    .sign-in button:disabled { cursor: wait; opacity: .7; }
    .error { min-height: 16px; margin: 0; color: #f0adc9; font-size: 11px; }

    @keyframes mark-lift {
      0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 4px 4px rgb(0 0 0 / 34%)); }
      44%, 60% { transform: translateY(-14px) scale(1.04); filter: drop-shadow(0 21px 13px rgb(0 0 0 / 62%)) drop-shadow(0 0 10px rgb(229 189 104 / 20%)); }
    }
    @keyframes aura {
      0%, 100% { opacity: .46; transform: scale(.88) rotate(-2deg); }
      50% { opacity: .72; transform: scale(1) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="entry">
    <button class="mark" id="open-sign-in" type="button" aria-label="Sign in" aria-expanded="false" aria-controls="sign-in-panel">
      <span aria-hidden="true">M</span>
    </button>
    <dialog class="sign-in" id="sign-in-panel" aria-labelledby="sign-in-title">
      <div class="sign-in-header">
        <h1 id="sign-in-title">Sign in</h1>
        <button class="close-dialog" id="close-sign-in" type="button">Close</button>
      </div>
      <form id="sign-in-form">
        <label for="username">Username<input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required minlength="3" maxlength="30" autofocus></label>
        <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label>
        <p class="error" id="sign-in-error" role="alert" aria-live="polite"></p>
        <button type="submit">Sign in</button>
      </form>
    </dialog>
  </main>
  <script>
    (() => {
      const mark = document.querySelector("#open-sign-in");
      const panel = document.querySelector("#sign-in-panel");
      const form = document.querySelector("#sign-in-form");
      const error = document.querySelector("#sign-in-error");

      const closeButton = document.querySelector("#close-sign-in");

      mark.addEventListener("click", () => {
        panel.showModal();
        mark.setAttribute("aria-expanded", "true");
      });

      closeButton.addEventListener("click", () => panel.close());
      panel.addEventListener("close", () => {
        mark.setAttribute("aria-expanded", "false");
        mark.focus();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const submit = form.querySelector("button[type='submit']");
        const data = new FormData(form);
        error.textContent = "";
        submit.disabled = true;
        submit.textContent = "Please wait…";

        try {
          const response = await fetch("/api/auth/sign-in/username", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: String(data.get("username") ?? "").trim(),
              password: String(data.get("password") ?? "")
            })
          });
          if (!response.ok) throw new Error("Sign-in failed");
          window.location.assign("/");
        } catch {
          error.textContent = "Sign-in failed. Try again.";
          submit.disabled = false;
          submit.textContent = "Sign in";
        }
      });
    })();
  </script>
</body>
</html>
